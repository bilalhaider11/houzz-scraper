version: '3.8'

services:
  houzz-scraper-dev:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for hot reloading
      - .:/app
      # Keep node_modules and other dependencies in container
      - /app/__pycache__
      - /app/.pytest_cache
      # PERSISTENT DATA VOLUMES - Critical for SQLite3 data persistence
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    working_dir: /app
