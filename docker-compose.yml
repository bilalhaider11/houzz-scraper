services:
  houzz-scraper:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # PERSISTENT DATA VOLUMES - Critical for SQLite3 data persistence
      - houzz_data:/app/data
      - houzz_logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - MAX_PAGES_PER_STATE=2
      - TIMEOUT=30
      - HEADLESS=true
      - ZEROBOUNCE_API_KEY=${ZEROBOUNCE_API_KEY}
      - PROXY_USERNAME=${PROXY_USERNAME}
      - PROXY_PASSWORD=${PROXY_PASSWORD}
      - WEBSHARE_API_KEY=${WEBSHARE_API_KEY}
      - WEBSHARE_PROXY_LIST=${WEBSHARE_PROXY_LIST}
      - USE_PROXY_ROTATION=${USE_PROXY_ROTATION}
      - PROXY_ROTATION_INTERVAL=${PROXY_ROTATION_INTERVAL}
      - GOOGLE_SHEETS_SPREADSHEET_ID=${GOOGLE_SHEETS_SPREADSHEET_ID}
      - GOOGLE_SHEETS_WORKSHEET_NAME=${GOOGLE_SHEETS_WORKSHEET_NAME}
      - GOOGLE_SHEETS_PROFILES_SPREADSHEET_ID=${GOOGLE_SHEETS_PROFILES_SPREADSHEET_ID}
      - GOOGLE_SHEETS_PROFILES_WORKSHEET_NAME=${GOOGLE_SHEETS_PROFILES_WORKSHEET_NAME}
      - GOOGLE_SHEETS_CLIENT_EMAIL=${GOOGLE_SHEETS_CLIENT_EMAIL}
      - GOOGLE_SHEETS_PRIVATE_KEY=${GOOGLE_SHEETS_PRIVATE_KEY}
      - GOOGLE_SHEETS_PROJECT_ID=${GOOGLE_SHEETS_PROJECT_ID}
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '2.0'
        reservations:
          memory: 4G
          cpus: '1.0'
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    working_dir: /app
    restart: unless-stopped

volumes:
  # Named volumes for data persistence
  houzz_data:
    driver: local
  houzz_logs:
    driver: local
