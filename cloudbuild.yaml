# Cloud Build configuration for Google Cloud Run deployment
# Environment variables are set separately via deployment script (from .env file)
# This keeps sensitive data out of version control
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/houzz-scraper:$BUILD_ID', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/houzz-scraper:$BUILD_ID']
  
  # Deploy container image to Cloud Run (without environment variables)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'houzz-scraper'
      - '--image'
      - 'gcr.io/$PROJECT_ID/houzz-scraper:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '8Gi'
      - '--cpu'
      - '2'
      - '--cpu-boost'
      - '--execution-environment'
      - 'gen2'
      - '--timeout'
      - '3600'
      - '--max-instances'
      - '1'
      - '--min-instances'
      - '1'

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/houzz-scraper:$BUILD_ID'

# Build options optimized for low-frequency scraping (1-2 requests/hour)
options:
  diskSizeGb: 20
