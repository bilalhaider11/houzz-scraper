# Cloud Build configuration for Google Cloud Run deployment
steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/houzz-scraper:$COMMIT_SHA', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/houzz-scraper:$COMMIT_SHA']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'houzz-scraper'
      - '--image'
      - 'gcr.io/$PROJECT_ID/houzz-scraper:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '8Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '3600'
      - '--max-instances'
      - '1'
      - '--min-instances'
      - '1'
      - '--set-env-vars'
      - 'HEADLESS=true,TIMEOUT=30,MAX_PAGES_PER_STATE=2,OUTPUT_DIR=/tmp/data,LOG_DIR=/tmp/logs'

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/houzz-scraper:$COMMIT_SHA'

# Build options optimized for hourly scraping
options:
  machineType: 'E2_HIGHCPU_2'
  diskSizeGb: 20
